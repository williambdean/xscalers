# prek: https://github.com/j178/prek
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: meta
    hooks:
      - id: check-useless-excludes

  # data-verified docstrings: the example datasets' shape claims against
  # the data the loaders actually produce (scripts/check_dataset_docstrings.py)
  - repo: local
    hooks:
      - id: dataset-docstrings
        name: dataset docstring shape claims
        entry: uv run python scripts/check_dataset_docstrings.py
        language: system
        pass_filenames: false
        files: ^(src/xscalers/datasets\.py|scripts/check_dataset_docstrings\.py)$
